<div class="card" *ngFor="let producto of productos">
    <img [src]="'http://127.0.0.1:8000/' + producto.image" alt="{{ producto.name }}">
    <div class="card-body">
      <h2>{{ producto.name }}</h2>
      <p>{{ producto.description }}</p>
      <p>Stock: {{ producto.stock }}</p>
      <p>Precio: {{ producto.price }}</p>
    </div>
  </div>
